<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><link rel="stylesheet" href="{{ url_for('static', path='css/card.css') }}"><link rel="stylesheet" href="{{ url_for('static', path='css/resources.css') }}"></head>
  <body>
    <article class="card tier-{{ card.tier }}">
      <div class="art"><img src="/{{ card.artwork }}" alt="Artwork for {{ card.name }}"></div>
      <div class="mist"></div>
      <header><span>RHODES ISLAND</span><strong>TIER {{ card.tier }}</strong></header>
      <div class="influence"><small>INF</small><b>{{ card.influence }}</b></div>
      <div class="operator-mark">{{ card.operator_class[:1] }}</div>
      <footer>
        <p class="class-name">{{ card.operator_class }}</p><h1>{{ card.name }}</h1>
        <div class="costs">{% for resource, label, amount in card.active_costs %}<div class="cost {{ resource }}"><span>{{ label }}</span><b>{{ amount }}</b></div>{% endfor %}</div>
      </footer>
    </article>
  </body>
</html>
