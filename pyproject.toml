[project]
name = "splendor-ak"
version = "0.1.0"
description = "Local HTML/CSS to PNG card generator for a fan-made Arknights board game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "playwright>=1.50",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
